name: Build & Publish docker cryptpad

# cspell:words buildx

on:
  # This job must be manually triggered to publish a new version usable from
  # other CI runs.
  workflow_dispatch:
  pull_request:
    paths:
      - '**' # Add all files
      - '!.github/**' # Ignore every other github's files
      - .github/workflows/docker-cryptpad.yml # Re-include current workflow

  # Run the workflow when we push a tag
  push:
    tags: 
      - "v[0-9]+.**"

permissions:
  contents: write
  packages: write
  
# We set `concurrency` to prevent having this workflow being run on code that is not up-to-date on a PR (a user make multiple push in a quick manner).
# But outside of a PR, we want to have only 1 workflow to be run at the same time on a given git ref
concurrency:
  group: docker-cryptpad-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        timeout-minutes: 5

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the Github Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images:
            ghcr.io/scille/cryptpad-server/cryptpad
          labels: |
            org.opencontainers.image.title=Cryptpad container
          annotations: |
            manifest:org.opencontainers.image.title=Cryptpad container
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=ref,event=tag
            type=ref,event=pr
            type=edge
          flavor: |
            latest=auto

      - name: Build and export to Docker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          push: false
        timeout-minutes: 20

      - name: Start docker test container
        id: start-test-container
        shell: bash
        run: |
          (
            echo -n "id=";
            docker run --detach --publish 3000:3000 --name=cryptpad ${{ steps.build.outputs.imageid }}
          ) | tee $GITHUB_OUTPUT
        timeout-minutes: 1

      - name: Test docker image
        id: test-container
        run: curl -f --retry-all-errors --retry 10 --retry-delay 2 --max-time 2 http://127.0.0.1:3000
        timeout-minutes: 1

      - name: Show container logs
        if: failure()
        run: docker ps -a && docker logs cryptpad

      - name: Stop docker test container
        if: always()
        run: docker stop cryptpad
        timeout-minutes: 1

      - name: Image to be published
        run: echo "${{ steps.metadata.outputs.tags }}"

      - name: Build and publish
        if: contains(fromJSON('["workflow_dispatch", "push"]'), github.event_name)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          push: true
        timeout-minutes: 5
